name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm trusted publishing signs in with the workflow's OIDC token, so no npm token is stored here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to point to a commit on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - name: Require the tag to match the package version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json, which says $version."
            exit 1
          fi

      - uses: ./.github/actions/setup

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and tests
        run: pnpm run check

      - name: Publish to npm
        run: npm publish --access public --provenance
